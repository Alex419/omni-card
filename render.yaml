# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# One free web service runs everything: the built React client, the JSON API and the WebSocket.
services:
  - type: web
    name: omni-card
    runtime: node
    plan: free
    # Closest to East Coast players (and to the Supabase database in us-east-1).
    # Render can't move an existing service: changing this means creating the service again.
    region: virginia
    # --include=dev: the build needs TypeScript, Vite and tsup even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploy a push to main only after the GitHub Actions checks (typecheck, lint, tests, build) pass.
    autoDeployTrigger: checksPass
    # Docs-only changes don't need a rebuild (and a redeploy would end open games).
    buildFilter:
      ignoredPaths:
        - docs/**
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # Set these two in the dashboard (they are secrets, so they are not stored in this file).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
